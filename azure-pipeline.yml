trigger:
  tags:
    include:
      - "v*"
  branches:
    exclude:
      - "*"

pool:
  vmImage: "ubuntu-latest"

variables:
  buildConfiguration: "Release"

steps:
  - task: UseDotNet@2
    displayName: "Use SDK from global.json"
    inputs:
      packageType: "sdk"
      useGlobalJson: true
      workingDirectory: "$(Build.SourcesDirectory)"
      includePreviewVersions: true

  - task: Bash@3
    displayName: "Update xUnit Runner Config"
    inputs:
      targetType: "inline"
      script: |
        echo '{
            "parallelizeAssembly": false,
            "parallelizeTestCollections": false,
            "diagnosticMessages": false
        }' > Tests/IntegrationTests/FastEndpoints/xunit.runner.json

  - task: DotNetCoreCLI@2
    displayName: "Run .NET 11 Tests"
    inputs:
      command: "test"
      projects: "Tests/**/*.csproj"
      arguments: "--configuration $(BuildConfiguration) --framework net11.0 --filter ExcludeInCiCd!=Yes --max-parallel-test-modules 1"
      workingDirectory: "Tests"